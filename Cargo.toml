[workspace]
members = ["ghostty-sys"]

[package]
name = "hmux"
version = "0.1.0"
edition = "2021"
description = "tmux-compatible server with agent control"
license = "GPL-3.0-only"

[[bin]]
name = "hmux"
path = "src/main.rs"

[lib]
name = "hmux"
path = "src/lib.rs"

[features]
default = []
# The libghostty-vt backend. It is no longer the shipped engine; it is kept so
# `vt::differential` can still diff the in-house engine against it, and as the
# alternate implementation the seam was carved to allow.
ghostty = ["dep:ghostty-sys"]

[dependencies]
ghostty-sys = { path = "ghostty-sys", optional = true }
libc = "0.2"
mio = { version = "1.2", features = ["os-ext", "os-poll"] }
regex = "1"
signal-hook = "0.3"
terminfo = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
