[workspace]
members = ["hmux-rt", "hmux-vt"]

# A future that parks cx.waker() instead of cx.local_waker() hangs silently on
# this runtime (see hmux-rt/README.md), and no type can express the
# difference — this lint is the compile-time enforcement.
#
# The server state is an `Rc<RefCell<_>>` and the command queue is a task, so a
# borrow held across an await deadlocks the next command that wants the state.
# Commands that wait borrow in tight scopes around the await instead; this lint
# is what keeps them that way.
[workspace.lints.clippy]
disallowed_methods = "deny"
await_holding_refcell_ref = "deny"

[package]
name = "hmux"
version = "0.1.0"
edition = "2024"
description = "tmux-compatible server with agent control"
license = "GPL-3.0-only"

[[bin]]
name = "hmux"
path = "src/main.rs"

[lib]
name = "hmux"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
hmux-rt = { path = "hmux-rt" }
hmux-vt = { path = "hmux-vt" }
bytes = "1"
libc = "0.2"
regex = "1"
terminfo = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
