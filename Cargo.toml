[workspace]
members = ["hmux-agent", "hmux-rt"]

# hmux-agent and hmux-rt are shared with the hmux0/ daemon, which borrows them
# as path dependencies from outside this workspace. Their lints live here, at
# the workspace that owns them.
[workspace.lints.clippy]
disallowed_methods = "deny"
await_holding_refcell_ref = "deny"

[package]
name = "hmux"
authors = ["blmarket"]
version = "0.0.0"
publish = false
edition = "2024"
autobins = false

[lib]
name = "tmux_c2rs"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
path = "src/main.rs"
name = "hmux"

[dependencies]
c2rust-bitfields = "0.22.1"
libc = "0.2"
lalrpop-util = { version = "0.23.1", default-features = false, features = ["std"] }
hmux-agent = { path = "hmux-agent" }
hmux-rt = { path = "hmux-rt" }
bytes = "1"
bytes-utils = "0.1.4"

[build-dependencies]
lalrpop = { version = "0.23.1", default-features = false }

# The transpiled code keeps C's shape: `static mut` globals that every access
# borrows, and raw pointers whose fields are reached through method calls.
# Allowed until those two patterns are rewritten.
[lints.rust]
static_mut_refs = "allow"
dangerous_implicit_autorefs = "allow"

[lints.clippy]
missing_safety_doc = "allow"
disallowed_methods = "deny"
await_holding_refcell_ref = "deny"
