[workspace]
members = [
    "hmux-buffer",
    "hmux-cmdparse",
    "hmux-rt",
    "hmux-refbox",
]

[package]
name = "hmux2"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "hmux2"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
path = "src/main.rs"
name = "hmux2"

[dependencies]
futures-core = "0.3"
hmux-cmdparse = { path = "hmux-cmdparse" }
hmux-rt = { path = "hmux-rt" }
hmux-buffer = { path = "hmux-buffer" }
c2rust-bitfields = "0.22.1"
libc = "0.2"
refbox = { package = "hmux-refbox", path = "hmux-refbox" }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
