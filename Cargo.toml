[workspace]
members = ["hmux-rt", "hmux-vt"]

# A future that parks cx.waker() instead of cx.local_waker() hangs silently on
# this runtime (see hmux-rt/README.md), and no type can express the
# difference — this lint is the compile-time enforcement.
[workspace.lints.clippy]
disallowed_methods = "deny"

[package]
name = "hmux"
version = "0.1.0"
edition = "2021"
description = "tmux-compatible server with agent control"
license = "GPL-3.0-only"

[[bin]]
name = "hmux"
path = "src/main.rs"

[lib]
name = "hmux"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
hmux-rt = { path = "hmux-rt" }
hmux-vt = { path = "hmux-vt" }
libc = "0.2"
regex = "1"
signal-hook = "0.3"
terminfo = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
