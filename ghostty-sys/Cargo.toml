[package]
name = "ghostty-sys"
version = "0.1.0"
edition = "2021"
description = "Raw FFI bindings and a safe wrapper over libghostty-vt (Ghostty's VT/terminal-emulation core), pinned to an unpatched upstream release-line commit."
license = "MIT"

# The build script locates and statically links libghostty-vt (building it from
# the vendored source with `zig build` when no prebuilt archive is available).
# See build.rs for the LIBGHOSTTY_VT_* env overrides.
build = "build.rs"

[dependencies]
